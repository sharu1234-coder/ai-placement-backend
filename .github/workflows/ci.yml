name: Backend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel a stale run for the same branch/PR when a new push arrives -- keeps this within the
# free private-repo Actions minutes budget instead of stacking up redundant runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo and never deploys, publishes, or writes
# anything back to GitHub.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CI/production runtime. Python 3.9 (this project's original pin) reached end-of-life
      # on 2025-10-31 (PEP 596) -- no more security patches. Assessed via a throwaway matrix
      # workflow (backend PRODUCTION_READINESS_FINAL.md's Phase 2 audit) before changing this:
      # the existing pinned requirements.txt -- including bcrypt==4.0.1 and greenlet==3.0.3,
      # commented as pinned for local Windows-wheel reasons, not this Python version -- and
      # the full test suite, Alembic migrations against real PostgreSQL, a startup/health
      # smoke test, and validate_for_production()'s fail-fast behavior all passed identically
      # on 3.9, 3.11, and 3.12 with zero dependency changes. 3.12 chosen for the longer
      # remaining support window (EOL 2028-10 vs 3.11's 2027-10).
      #
      # Local dev used to stay on Python 3.9 "because the app behaves identically anyway".
      # That turned out to be costly: requirements.txt was resolved on the 3.9 machine, and
      # every current fix release for ~10 packages requires >=3.10, so the pins sat on 31
      # known CVEs that CI then faithfully installed onto 3.12. Behaving identically is not
      # the same as being patchable identically. Local now matches this version -- keep it
      # that way, and see requirements.txt's header before touching a pin.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests scripts

      # Fails the build on a known-CVE dependency. Dependabot already *detects* these and has
      # done for a while -- what was missing was anything that forced the issue, so advisories
      # accumulated to 31 across 10 packages while every build stayed green. Detection without
      # enforcement is just a mailing list.
      #
      # Audits the pinned requirements files rather than the installed environment, so a
      # vulnerable pin fails here even if the runner happens to resolve something newer.
      # If this step fails: read the advisory, bump the pin (checking requirements.txt's
      # header note about Python version first), and re-run -- do not add an ignore flag
      # without recording why in the pin's comment.
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      # No external services needed: tests/conftest.py spins up an in-memory SQLite database
      # per test, so this doesn't need Postgres, S3, SMTP, or any API key configured.
      - name: Run tests
        run: pytest -q

  # Production is PostgreSQL, and SQLite cannot show us the differences that matter: a failed
  # statement poisons a Postgres transaction until it is rolled back, foreign keys are always
  # enforced rather than opt-in, and sequences, types and ordering are its own. The savepoint
  # recovery paths in this codebase were written for those semantics, so they deserve to run
  # against them.
  #
  # A separate job rather than a matrix on the one above: the SQLite suite is the fast signal
  # every push needs, and making it wait on a database container would slow the common case to
  # buy nothing. This one runs the API tests, which are the ones that actually touch a
  # database -- the unit tests build their own in-memory engines and are about pure logic.
  test-postgres:
    runs-on: ubuntu-latest
    # A lock wait has no timeout of its own, so a session left open by a test blocks the next
    # test's DDL forever and the job sits there burning runner minutes with no output and no
    # failing test name -- which is exactly how the first full PostgreSQL run of this suite
    # behaved locally. tests/conftest.py now sets lock_timeout so that surfaces as a failure
    # instead; this is the outer backstop for anything it does not cover.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aiplacement_test
        ports:
          - 5432:5432
        # Without this the job can start connecting before the server accepts connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # The migrations are the contract between this code and a real database, and they are
      # worth verifying independently of the tests: a migration that only works on SQLite
      # passes the whole suite above and fails on the first real deploy.
      - name: Verify migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/aiplacement_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      # `tests/api` was the whole of this step, which left a hole: the business-claim
      # concurrency tests live in `tests/unit` and so had never run against PostgreSQL
      # anywhere -- not in CI, and not locally, where no authorised disposable database is
      # configured. They are exactly the tests that cannot be trusted from SQLite alone,
      # because SQLite serialises writers with one database-level lock while PostgreSQL
      # arbitrates per row, and the post-conflict re-read depends on READ COMMITTED taking a
      # fresh snapshot per statement. Named explicitly rather than widening to `tests/unit`,
      # so adding a slow unit suite to this PostgreSQL run stays a deliberate act.
      - name: Run API and claim-concurrency tests against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/aiplacement_test
        run: pytest -q tests/api tests/unit/test_business_claim.py
