name: Backend CI

on:
  push:
    # `master` plus the active development branch. Until 2026-10-19 this listed `master`
    # only, while all real work happened on the long-running feature branch below -- so
    # GitHub ran this workflow zero times for any of it, and `gh run list` showed nothing
    # but Dependabot. A branch nobody tests is a branch whose green local run means nothing.
    branches: [master, professional-presence-intelligence]
  # No branch filter: a pull request into ANY branch gets checked, not only ones
  # targeting `master`. Review on a feature branch was previously unguarded too.
  pull_request:

# Cancel a stale run for the same branch/PR when a new push arrives -- keeps this within the
# free private-repo Actions minutes budget instead of stacking up redundant runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo and never deploys, publishes, or writes
# anything back to GitHub.
permissions:
  contents: read

jobs:
  test:
    # Pinned, not `ubuntu-latest`. That label rolled from Ubuntu 24.04.5 to 26.04.1 between runs
    # 39500689829 and 44942286471 with nothing in this repository changing, and it silently
    # altered two outcomes: the PostgreSQL client went from 16.x to 18.7, breaking a test that
    # asserted an exact version, and a timing-sensitive voice test changed verdict. An image
    # upgrade is a real change to the test environment, so it should arrive as a reviewable edit
    # here rather than on GitHub's schedule.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CI/production runtime. Python 3.9 (this project's original pin) reached end-of-life
      # on 2025-10-31 (PEP 596) -- no more security patches. Assessed via a throwaway matrix
      # workflow (backend PRODUCTION_READINESS_FINAL.md's Phase 2 audit) before changing this:
      # the existing pinned requirements.txt -- including bcrypt==4.0.1 and greenlet==3.0.3,
      # commented as pinned for local Windows-wheel reasons, not this Python version -- and
      # the full test suite, Alembic migrations against real PostgreSQL, a startup/health
      # smoke test, and validate_for_production()'s fail-fast behavior all passed identically
      # on 3.9, 3.11, and 3.12 with zero dependency changes. 3.12 chosen for the longer
      # remaining support window (EOL 2028-10 vs 3.11's 2027-10).
      #
      # Local dev used to stay on Python 3.9 "because the app behaves identically anyway".
      # That turned out to be costly: requirements.txt was resolved on the 3.9 machine, and
      # every current fix release for ~10 packages requires >=3.10, so the pins sat on 31
      # known CVEs that CI then faithfully installed onto 3.12. Behaving identically is not
      # the same as being patchable identically. Local now matches this version -- keep it
      # that way, and see requirements.txt's header before touching a pin.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests scripts

      # Fails the build on a known-CVE dependency. Dependabot already *detects* these and has
      # done for a while -- what was missing was anything that forced the issue, so advisories
      # accumulated to 31 across 10 packages while every build stayed green. Detection without
      # enforcement is just a mailing list.
      #
      # Audits the pinned requirements files rather than the installed environment, so a
      # vulnerable pin fails here even if the runner happens to resolve something newer.
      # If this step fails: read the advisory, bump the pin (checking requirements.txt's
      # header note about Python version first), and re-run -- do not add an ignore flag
      # without recording why in the pin's comment.
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      # pyttsx3 picks the platform default driver, which on Linux is eSpeak loaded through
      # ctypes -- so the espeak-ng OS package is a hard requirement that requirements.txt
      # cannot express. Without it tests/unit/test_tts_linux_contract.py fails with "the
      # local text-to-speech driver could not be initialised", which is exactly what run
      # 44942286471 reported the first time that test ever ran on Linux. That test is the
      # only thing that can show server-side TTS works on a deployment host, so the package
      # is installed rather than the test skipped. No audio device is involved: the contract
      # synthesises with save_to_file and reads the WAV back. Deployment hosts using this
      # TTS path need the same package -- see README, "Server-side TTS (eSpeak on Linux)".
      - name: Install espeak-ng (required by the Linux TTS contract)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng

      # Recorded because two findings in run 44942286471 were environment-dependent and the log
      # carried no way to tell which environment produced them. Cheap, and it makes a future
      # "but it passed last week" an answerable question.
      - name: Record environment diagnostics
        run: |
          echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          . /etc/os-release && echo "os: $PRETTY_NAME"
          echo "python: $(python --version 2>&1)"
          for tool in pg_dump pg_restore psql; do
            if command -v "$tool" > /dev/null; then
              echo "$tool: $("$tool" --version)"
            else
              echo "$tool: not on PATH"
            fi
          done
          echo "espeak-ng: $(espeak-ng --version 2>&1 | head -1)"

      # No external services needed: tests/conftest.py spins up an in-memory SQLite database
      # per test, so this doesn't need Postgres, S3, SMTP, or any API key configured.
      #
      # --junitxml so a failure leaves behind its message and traceback rather than one
      # `FAILED ...` line. Each of run 44942286471's four failures had to be reconstructed from
      # console text because the report died with the runner.
      - name: Run tests
        run: pytest -q --junitxml=reports/junit-sqlite.xml

      # always(), because this exists for the case where the step above failed, and a failing
      # step stops the ones after it. continue-on-error so a problem uploading diagnostics can
      # never turn a green suite red nor replace a real test failure with an artifact error.
      # if-no-files-found: warn for the same reason -- a crash before pytest wrote any XML, a
      # collection error say, must still be reported as itself. Only the JUnit XML goes up:
      # nothing here touches .env files, requirements or any credential.
      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-results-sqlite
          path: reports/junit-sqlite.xml
          retention-days: 7
          if-no-files-found: warn

  # Production is PostgreSQL, and SQLite cannot show us the differences that matter: a failed
  # statement poisons a Postgres transaction until it is rolled back, foreign keys are always
  # enforced rather than opt-in, and sequences, types and ordering are its own. The savepoint
  # recovery paths in this codebase were written for those semantics, so they deserve to run
  # against them.
  #
  # A separate job rather than a matrix on the one above: the SQLite suite is the fast signal
  # every push needs, and making it wait on a database container would slow the common case to
  # buy nothing. This one runs the API tests, which are the ones that actually touch a
  # database -- the unit tests build their own in-memory engines and are about pure logic.
  test-postgres:
    # Pinned for the same reason as the job above -- see the comment there.
    runs-on: ubuntu-26.04
    # A lock wait has no timeout of its own, so a session left open by a test blocks the next
    # test's DDL forever and the job sits there burning runner minutes with no output and no
    # failing test name -- which is exactly how the first full PostgreSQL run of this suite
    # behaved locally. tests/conftest.py now sets lock_timeout so that surfaces as a failure
    # instead; this is the outer backstop for anything it does not cover.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aiplacement_test
        ports:
          - 5432:5432
        # Without this the job can start connecting before the server accepts connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # The migrations are the contract between this code and a real database, and they are
      # worth verifying independently of the tests: a migration that only works on SQLite
      # passes the whole suite above and fails on the first real deploy.
      - name: Verify migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/aiplacement_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      # `tests/api` was the whole of this step, which left a hole: the business-claim
      # concurrency tests live in `tests/unit` and so had never run against PostgreSQL
      # anywhere -- not in CI, and not locally, where no authorised disposable database is
      # configured. They are exactly the tests that cannot be trusted from SQLite alone,
      # because SQLite serialises writers with one database-level lock while PostgreSQL
      # arbitrates per row, and the post-conflict re-read depends on READ COMMITTED taking a
      # fresh snapshot per statement. Named explicitly rather than widening to `tests/unit`,
      # so adding a slow unit suite to this PostgreSQL run stays a deliberate act.
      - name: Run API and claim-concurrency tests against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/aiplacement_test
          # tests/db_safety.py refuses a destructive target that has not been declared
          # disposable, because the suite drops every table in it before the first test. This
          # database is created by the `services: postgres` container above and dies with the
          # job, so declaring it here is a statement of fact.
          TEST_DATABASE_DESTRUCTIVE: "1"
          # That container has exactly one role, and it is the superuser. The guard refuses an
          # instance-wide role by default -- a name suffix protects nothing if the role can
          # reach every other database on the instance -- and this is the one situation the
          # exemption exists for: the instance holds nothing but this test database and is
          # destroyed when the job ends. A long-lived instance needs a dedicated test role
          # instead, which is why the exemption is explicit rather than inferred from CI.
          TEST_DATABASE_ALLOW_ADMIN_ROLE: "1"
        run: pytest -q tests/api tests/unit/test_business_claim.py --junitxml=reports/junit-postgres.xml

      # Both halves of the compatibility contract tests/unit/test_pg_client_args.py asserts: the
      # client that would take a backup, and the server it would be taken from. Recorded here
      # because this is the only job with a server to ask.
      - name: Record PostgreSQL client and server versions
        if: always()
        continue-on-error: true
        env:
          PGPASSWORD: postgres
        run: |
          echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          . /etc/os-release && echo "os: $PRETTY_NAME"
          echo "client pg_dump:    $(pg_dump --version 2>&1)"
          echo "client pg_restore: $(pg_restore --version 2>&1)"
          echo "client psql:       $(psql --version 2>&1)"
          echo "server: $(psql -h localhost -U postgres -d aiplacement_test -tAc 'select version()' 2>&1)"

      # See the matching step in the `test` job for why always() and continue-on-error.
      - name: Upload PostgreSQL test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-results-postgres
          path: reports/junit-postgres.xml
          retention-days: 7
          if-no-files-found: warn
