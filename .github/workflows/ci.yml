name: Backend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel a stale run for the same branch/PR when a new push arrives -- keeps this within the
# free private-repo Actions minutes budget instead of stacking up redundant runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo and never deploys, publishes, or writes
# anything back to GitHub.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CI/production runtime. Python 3.9 (this project's original pin) reached end-of-life
      # on 2025-10-31 (PEP 596) -- no more security patches. Assessed via a throwaway matrix
      # workflow (backend PRODUCTION_READINESS_FINAL.md's Phase 2 audit) before changing this:
      # the existing pinned requirements.txt -- including bcrypt==4.0.1 and greenlet==3.0.3,
      # commented as pinned for local Windows-wheel reasons, not this Python version -- and
      # the full test suite, Alembic migrations against real PostgreSQL, a startup/health
      # smoke test, and validate_for_production()'s fail-fast behavior all passed identically
      # on 3.9, 3.11, and 3.12 with zero dependency changes. 3.12 chosen for the longer
      # remaining support window (EOL 2028-10 vs 3.11's 2027-10). Local dev on this project's
      # machine stays on Python 3.9 for now (see README) -- that's fine, this test already
      # proved the app behaves identically across versions.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests scripts

      # No external services needed: tests/conftest.py spins up an in-memory SQLite database
      # per test, so this doesn't need Postgres, S3, SMTP, or any API key configured.
      - name: Run tests
        run: pytest -q
