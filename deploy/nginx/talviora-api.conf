# TALVIORA AI -- Nginx reverse proxy for the API.
#
# Topology: Internet -> Nginx (this file) -> Uvicorn on 127.0.0.1:8000.
# One DigitalOcean Droplet, one Nginx, one Uvicorn worker. See
# docs/PRODUCTION_DEPLOYMENT.md for the firewall, TLS and restart procedures, and
# app/server.py for the matching server side of the contract.
#
# Committed so it can be reviewed and diffed. Replace api.example.com with the real
# domain; nothing else here should need editing, and anything that does should be
# changed in a reviewed commit rather than live on the host.
#
# ---------------------------------------------------------------------------------
# THE ONE RULE THAT MATTERS
#
# X-Forwarded-For is set to $remote_addr -- OVERWRITTEN, never appended.
#
# Do not use $proxy_add_x_forwarded_for in this topology. Nginx's documentation
# defines it as "the 'X-Forwarded-For' client request header field with the
# $remote_addr variable appended to it", which means it PRESERVES whatever the caller
# sent and puts the truth after it. Uvicorn would still resolve the right address --
# it walks the list from the right and takes the first untrusted entry, which is the
# one Nginx appended -- but that makes correctness depend on the walk being right.
# Overwriting means no caller-supplied byte reaches the application in that header at
# all, so there is nothing to walk and nothing to get wrong.
#
# $proxy_add_x_forwarded_for becomes correct only when there is a second trusted proxy
# in front of this one whose value must be preserved. There is not. If Cloudflare is
# added later, that is a different topology with a different trust configuration (see
# the Cloudflare section in docs/PRODUCTION_DEPLOYMENT.md) and this file must be
# revisited deliberately, not patched.
# ---------------------------------------------------------------------------------

upstream talviora_api {
    # Loopback only. Uvicorn never holds a public socket (app/server.py fixes
    # host=127.0.0.1), so this is the only way in and Nginx is the only thing that can
    # take it.
    server 127.0.0.1:8000;
    keepalive 32;
}

# WebSocket upgrade is hop-by-hop, so nginx will not pass it through on its own. This
# map sends "upgrade" for a real upgrade request and "close" otherwise, which is the
# form nginx's own websocket documentation gives.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ----------------------------------------------------------------- port 80: ACME + redirect

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # The only thing served over plaintext. Certbot writes the challenge file here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Everything else goes to HTTPS. 301 rather than 302: this is permanent, and a
    # permanent redirect is what lets a client remember not to try plaintext again.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------- port 443: the API

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # HTTP/2 -- VERSION-DEPENDENT, so check before copying this file onto a host.
    #
    # The standalone `http2 on;` directive below exists only from nginx 1.25.1. On an older
    # nginx it is an UNKNOWN DIRECTIVE and `nginx -t` fails outright, so the proxy will not
    # start at all. That is not a hypothetical: Ubuntu 24.04 LTS ships nginx 1.24.0.
    #
    # Run `nginx -v`, then keep exactly one of these:
    #   nginx >= 1.25.1   ->  http2 on;                     (the line below)
    #   nginx <  1.25.1   ->  listen 443 ssl http2;         (fold into the listen lines above
    #                                                        and delete the line below)
    #
    # The `listen ... http2` parameter still works on newer nginx but is deprecated there,
    # which is why the modern form is the default here rather than the portable one.
    http2 on;

    # Both families are listened on deliberately. Without the [::] line, IPv6 clients
    # fail to connect at all rather than falling back -- and the limiter keys IPv6
    # clients by /64 (app/core/rate_limit.py), which assumes they can arrive.
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS is set by the application (app/core/security_headers.py), which knows the
    # request scheme from X-Forwarded-Proto below. Not duplicated here, so there is one
    # place that decides it.

    # Resume uploads. Keep in step with MaxBodySizeMiddleware in app/main.py (12 MiB):
    # if nginx's limit is the smaller one the student gets a bare nginx 413 instead of
    # the application's own typed error.
    client_max_body_size 12m;

    # Do not advertise the nginx version to the internet.
    server_tokens off;

    access_log /var/log/nginx/talviora-api.access.log;
    error_log  /var/log/nginx/talviora-api.error.log warn;

    # -------------------------------------------------------- the API

    location / {
        proxy_pass http://talviora_api;
        proxy_http_version 1.1;

        # Every header is repeated in every location in this file, on purpose. Nginx's
        # documentation is explicit that proxy_set_header directives "are inherited
        # from the previous configuration level if and only if there are no
        # proxy_set_header directives defined on the current level" -- inheritance is
        # all-or-nothing, not per-header. A location that sets one header silently
        # discards every inherited one, which here would mean losing X-Forwarded-For
        # and resolving every client to 127.0.0.1. Repetition is the safe shape.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;   # OVERWRITE -- see header comment
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # -------------------------------------------------------- the voice WebSocket

    location /voice/session {
        proxy_pass http://talviora_api;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Repeated, not inherited -- see the note in location / above. Setting Upgrade
        # here is exactly what would discard the forwarded headers if they were only
        # declared at server level.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;

        # A voice turn includes the student thinking, speaking slowly, or pausing, and
        # nginx's documentation states that "the connection will be closed if the
        # proxied server does not transmit any data within 60 seconds". At the default
        # a quiet pause would drop a live conversation mid-session, which the Android
        # client sees as a dropped socket rather than an error it can explain.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Buffering off so audio is relayed as it arrives instead of in chunks.
        proxy_buffering off;
    }

    # -------------------------------------------------------- health checks

    # Separated only to keep the access log readable; same proxying rules, repeated
    # for the same inheritance reason.
    location = /health/ready {
        proxy_pass http://talviora_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;

        access_log off;
    }
}
